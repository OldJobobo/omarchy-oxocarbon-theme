# hyprland.conf
# Carbonized — Carbon easing, Oxocarbon palette
#
# Not a full Hyprland config. Intended to be included in main hyprland.conf.

$activeBorderColor   = rgba(78a9ffee) rgba(3ddbd9ee) rgba(78a9ffee) 45deg
$inactiveBorderColor = rgba(52525255)

general {
    col.active_border   = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
    border_size = 2
    gaps_in  = 4
    gaps_out = 8
}

group {
    col.border_active   = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
}

decoration {
    rounding = 0

    dim_inactive      = true
    dim_strength      = 0.15
    fullscreen_opacity = 1.0

    blur {
        enabled            = true
        size               = 5
        passes             = 3
        noise              = 0.02
        contrast           = 1.12
        brightness         = 0.86
        vibrancy           = 0.18
        vibrancy_darkness  = 0.72
        ignore_opacity     = true
        new_optimizations  = true
        xray               = false
        popups             = true
        popups_ignorealpha = 0.60
    }

    shadow {
        enabled        = true
        range          = 20
        render_power   = 3
        color          = rgba(00000099)
        color_inactive = rgba(0000004d)
        offset         = 2 4
    }
}

animations {
    enabled = true

    bezier = carbonEase, 0.4, 0, 0.2, 1

    animation = borderangle, 1, 20, carbonEase, once
    animation = windows,     1, 3,  carbonEase, slide
    animation = windowsIn,   1, 3,  carbonEase, slide
    animation = windowsOut,  1, 3,  carbonEase, slide
    animation = fade,        1, 3,  carbonEase
    animation = workspaces,  1, 4,  carbonEase, slide
}

windowrule = no_blur on, match:class ^(walker)$
windowrule = no_blur on, match:class ^(swayosd)$
